<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modalBody"></div></div>
<div id="toast"></div>
<script>
const STATUS_CLASS = {'งานใหม่':'b-new','รับงานแล้ว':'b-acc','กำลังดำเนินการ':'b-prog','รอข้อมูล/รออะไหล่':'b-wait','ส่งซ่อมภายนอก':'b-ext','ดำเนินการเรียบร้อย':'b-done','ยกเลิก':'b-cancel'};
const PRIO_CLASS = {'วิกฤต':'p-crit','สูง':'p-high','ปกติ':'p-norm','ต่ำ':'p-low'};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function call(fn, ...args){
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}
function errMsg(e){ return String((e && e.message) || e || 'เกิดข้อผิดพลาด').replace(/^(Exception|Error):\s*/, ''); }
let _toastTimer;
function toast(msg, type){
  const t = $('toast'); t.textContent = msg; t.className = 'show ' + (type || '');
  clearTimeout(_toastTimer); _toastTimer = setTimeout(() => t.className = '', 3800);
}
function busy(btn, on, text){
  if (!btn) return;
  if (on){ btn.dataset.t = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + (text || 'กำลังดำเนินการ...'); }
  else { btn.disabled = false; if (btn.dataset.t) btn.innerHTML = btn.dataset.t; }
}
function badge(s){ return `<span class="badge ${STATUS_CLASS[s] || ''}">${esc(s)}</span>`; }
function pbadge(p){ return `<span class="badge ${PRIO_CLASS[p] || ''}">${esc(p)}</span>`; }
function openModal(html){ $('modalBody').innerHTML = html; $('modal').classList.add('show'); document.body.style.overflow = 'hidden'; }
function closeModal(){ $('modal').classList.remove('show'); document.body.style.overflow = ''; }
function timeline(logs){
  if (!logs || !logs.length) return '<div class="empty">ยังไม่มีบันทึก</div>';
  return '<ul class="timeline">' + logs.slice().reverse().map(l => `
    <li>
      <div class="tl-time">${esc(l.createdAt)} · ${esc(l.actor)}</div>
      <div class="tl-title">${esc(l.action)} ${l.statusAfter ? badge(l.statusAfter) : ''}</div>
      ${l.detail ? `<div class="tl-text">${esc(l.detail)}</div>` : ''}
      ${l.fixList ? `<div class="tl-text"><b>รายการแก้ไข:</b> ${esc(l.fixList)}</div>` : ''}
      ${l.method ? `<div class="tl-meta">รูปแบบ: ${esc(l.method)}</div>` : ''}
    </li>`).join('') + '</ul>';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
